name: Test Persistence

on:
  workflow_dispatch: # Permite rodar manualmente

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Tests
        run: |
          # Criar .env temporário para o teste
          echo "POSTGRES_PASSWORD=teste123" > .env

          # Subir stack
          docker compose up -d --wait

          echo "--- STATUS ---"
          docker compose ps

          echo "--- INFO API ---"
          curl -s http://localhost/api/info

          echo "--- POST PRODUTO ---"
          curl -s -X POST http://localhost/api/produtos -H 'Content-Type: application/json' -d '{"nome":"Prova de persistencia","preco":9.9,"estoque":1}'

          echo "--- DOWN ---"
          docker compose down

          echo "--- UP AGAIN ---"
          docker compose up -d --wait

          echo "--- BUSCA ---"
          curl -s 'http://localhost/api/busca?q=persistencia'
